# Палитра рендера
[render.palette]
clear = [0.0, 0.0, 0.0]
grid = [0.0, 1.0, 0.0]
outline = [0.92, 0.95, 0.98]

# Цвета фигур (I, O, T, L, J, S, Z)
[shapes]
I = [0.0, 1.0, 0.0]
O = [1.0, 0.0, 0.0]
T = [0.0, 0.9, 1.0]
L = [0.0, 0.0, 1.0]
J = [1.0, 0.75, 0.0]
S = [1.0, 0.0, 0.8]
Z = [0.0, 1.0, 0.6]

# Размер стакана по умолчанию
[well]
width = 5
depth = 5
height = 10

# Геймплей
[gameplay]
fall_interval = 2.2
