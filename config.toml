# Палитра рендера
[render.palette]
clear = [0.024, 0.012, 0.059]
grid = [1.0, 1.0, 1.0]
outline = [0.92, 0.95, 0.98]

# Цвета фигур (I, O, T, L, J, S, Z, Dot, Bar2)
[shapes]
I = [0.298, 0.788, 0.941]
O = [0.969, 0.145, 0.522]
T = [0.443, 0.035, 0.718]
L = [0.263, 0.380, 0.933]
J = [0.024, 0.839, 0.627]
S = [0.969, 0.498, 0.000]
Z = [0.659, 0.333, 0.969]
Dot = [0.298, 0.788, 0.941]
Bar2 = [0.969, 0.145, 0.522]

# Размер стакана по умолчанию
[well]
width = 6
depth = 6
height = 20

# Геймплей
[gameplay]
fall_interval = 1.2
start_level = 0

# Пресет (modern|blockout). Для blockout используется data/forms_blockout.dat с центрами фигур, стакан 3x3x18, палитра/скорость как в Blockout.
[preset]
name = "blockout"
# basic|advanced|expert
blockout_set = "basic"
# forms_path = "data/forms_blockout.dat"

[controls]
move_left = "Left"
move_right = "Right"
move_forward = "Up"
move_back = "Down"
rot_x_pos = "E"
rot_x_neg = "D"
rot_z_pos = "W"
rot_z_neg = "S"
rot_y_pos = "Q"
rot_y_neg = "A"
hard_drop = "Space"
soft_drop = "V"
hold = "C"
wireframe = "F"
pause = "P"
